[project]
name = "tech-planner"
version = "0.1.0"
description = "Local Agile planning tool that drives an embedded Claude Code session"
readme = "README.md"
requires-python = ">=3.12"
# These belong to the HTTP driving adapter alone. The domain has zero
# dependencies by design and the CLI slice runs on the standard library;
# nothing under domain/ or application/ imports either of these.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
tech-planner = "tech_planner.adapters.driving.cli.main:main"
tech-planner-api = "tech_planner.adapters.driving.http.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_planner"]

[dependency-groups]
dev = ["pytest>=8.0"]

