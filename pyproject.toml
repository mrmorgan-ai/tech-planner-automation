[project]
name = "tech-planner"
version = "0.1.0"
description = "Local Agile planning tool that drives an embedded Claude Code session"
readme = "README.md"
requires-python = ">=3.12"
# The domain layer has zero dependencies by design. Runtime deps are added
# per-adapter as later phases land (Pydantic at the Claude Code boundary,
# FastAPI for the HTTP driving adapter).
dependencies = []

[project.scripts]
tech-planner = "tech_planner.adapters.driving.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_planner"]

[dependency-groups]
dev = ["pytest>=8.0"]

